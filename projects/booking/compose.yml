services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vibecamp_booking
      POSTGRES_USER: vibecamp
      POSTGRES_PASSWORD: vibecamp
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecamp -d vibecamp_booking"]
      interval: 1s
      timeout: 3s
      retries: 20
    volumes: ["booking-postgres:/var/lib/postgresql/data"]
volumes:
  booking-postgres:
