services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vibecamp_ecommerce
      POSTGRES_USER: vibecamp
      POSTGRES_PASSWORD: vibecamp
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecamp -d vibecamp_ecommerce"]
      interval: 1s
      timeout: 3s
      retries: 20
    volumes: ["ecommerce-postgres:/var/lib/postgresql/data"]
volumes:
  ecommerce-postgres:
