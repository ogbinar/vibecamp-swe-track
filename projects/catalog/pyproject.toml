[project]
name = "vibecamp-catalog"
version = "0.1.0"
description = "Runnable starter for VibeCamp M0"
requires-python = "==3.13.*"
dependencies = [
    "air==0.48.1",
    "fastapi[standard]>=0.116.0",
    "pydantic-settings>=2.10.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["catalog_api"]
