services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vibecamp_pos
      POSTGRES_USER: vibecamp
      POSTGRES_PASSWORD: vibecamp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecamp -d vibecamp_pos"]
      interval: 1s
      timeout: 3s
      retries: 20
    volumes:
      - pos-postgres:/var/lib/postgresql/data

volumes:
  pos-postgres:
