services:
  migrate:
    image: ${IMAGE_REF:?Set IMAGE_REF to an immutable digest}
    command: ["alembic", "upgrade", "head"]
    environment:
      POS_DATABASE_URL: postgresql+psycopg://vibecamp:${POSTGRES_PASSWORD:?required}@postgres:5432/vibecamp_pos
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    image: ${IMAGE_REF:?Set IMAGE_REF to an immutable digest}
    environment:
      POS_SERVICE_NAME: VibeCamp POS
      POS_DATABASE_URL: postgresql+psycopg://vibecamp:${POSTGRES_PASSWORD:?required}@postgres:5432/vibecamp_pos
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose: ["8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vibecamp_pos
      POSTGRES_USER: vibecamp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecamp -d vibecamp_pos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["pos-production:/var/lib/postgresql/data"]
volumes:
  pos-production:
