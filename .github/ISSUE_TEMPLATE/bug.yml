name: Defect or regression
description: Capture reproducible incorrect behavior
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include environment and sanitized commands or requests.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and suspected scope
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, test, or other evidence
