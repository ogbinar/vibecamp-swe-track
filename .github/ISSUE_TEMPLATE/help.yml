name: Learner help
description: Ask for focused help after using the milestone hint ladder
title: "[Help Mxx Cx/Ax] "
labels: [help-wanted]
body:
  - type: input
    id: location
    attributes:
      label: Milestone, block, and file
      placeholder: M2 / Block 1 / projects/pos/migrations/...
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and sanitized output
      description: Remove secrets and personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual observation
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Current hypothesis and hints already used
    validations:
      required: true
  - type: input
    id: green
    attributes:
      label: Last green reference
      placeholder: tag or commit
    validations:
      required: true
